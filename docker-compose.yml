version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noheir_api
    env_file: .env
    environment:
      APP_ENV: prod
      GIN_MODE: release
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    dns:
      - 8.8.8.8
      - 1.1.1.1
