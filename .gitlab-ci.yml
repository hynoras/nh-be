stages:
  - lint
  - test
  - build
  - deploy

.go_default:
  image: golang:1.25-alpine
  interruptible: true
  cache:
    key: go-mod
    paths:
      - /go/pkg/mod
      - ~/.cache/go-build
  before_script:
    - go version

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

