stages:
  - lint
  - test
  - build
  - deploy

.go_default:
  image: golang:1.25-alpine
  interruptible: true
  cache:
    key: go-mod
    paths:
      - /go/pkg/mod
      - ~/.cache/go-build
  before_script:
    - go version

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# -------------------------
# Lint
# -------------------------
lint:
  extends: .go_default
  stage: lint
  script:
    - echo "Checking code..."
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    - golangci-lint run --timeout=5m
    - echo "No lint issues found."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# -------------------------
# Unit Tests
# -------------------------
unit_test:
  extends: .go_default
  stage: test
  script:
    - echo "Running experiment result..."
    - go test -v ./internal/features/...
    - echo "All test passed."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# -------------------------
# Build
# -------------------------
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind

  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker build --pull -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -------------------------
# Deploy (production)
# -------------------------
deploy_production:
  stage: deploy
  image: alpine:latest
  timeout: 5m
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan noheir-api.duckdns.org >> ~/.ssh/known_hosts

  script:
    - export IMAGE=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - |
      ssh -o ConnectTimeout=10 quang@noheir-api.duckdns.org "
          set -ex

          cd /home/quang

          IMAGE=$IMAGE

          BLUE_PORT=8080
          GREEN_PORT=8081

          UPSTREAM_FILE=/etc/nginx/conf.d/upstream.conf

          echo '--- Pulling new image ---'
          docker pull \$IMAGE

          echo '--- Running database migrations ---'
          docker run --rm \
            --env-file .env \
            --network quang_default \
            --entrypoint sh \
            \$IMAGE \
            -c '
              DB_SSL_MODE=\${DB_SSL_MODE:-disable}
              DB_DSN=\"postgres://\${DB_USERNAME}:\${DB_PASSWORD}@\${DB_HOST}:\${DB_PORT}/\${DB_NAME}?sslmode=\${DB_SSL_MODE}\"
              /usr/local/bin/migrate -path /app/migrations -database \"\$DB_DSN\" up
            '

          echo '--- Migration succeeded ---'

          # Detect current active port from Nginx
          CURRENT_PORT=\$(grep -oP '127.0.0.1:\K\d+' \$UPSTREAM_FILE || echo \"\$BLUE_PORT\")

          if [ \"\$CURRENT_PORT\" = \"\$BLUE_PORT\" ]; then
              NEW_PORT=\$GREEN_PORT
          else
              NEW_PORT=\$BLUE_PORT
          fi

          echo \"Current port: \$CURRENT_PORT\"
          echo \"New port: \$NEW_PORT\"

          echo '--- Starting new container (green) ---'
          docker rm -f api-green 2>/dev/null || true

          docker run -d \
          --name api-green \
          --env-file .env \
          --network quang_default \
          -p \$NEW_PORT:8080 \
          \$IMAGE

          # Cleanup on failure
          trap 'echo \"Error occurred, cleaning up\"; docker rm -f api-green 2>/dev/null' ERR

          echo '--- Waiting for health check ---'
          for i in {1..15}; do
              STATUS=\$(docker inspect --format='{{.State.Health.Status}}' api-green 2>/dev/null || echo \"starting\")
              echo \"Health status: \$STATUS\"

              if [ \"\$STATUS\" = \"healthy\" ]; then
                  break
              fi

              sleep 2
          done

          if [ \"\$STATUS\" != \"healthy\" ]; then
              echo 'Deploy failed: container not healthy'
              docker rm -f api-green
              exit 1
          fi

          echo '--- Switching traffic (Nginx upstream) ---'
          echo \"upstream backend { server 127.0.0.1:\$NEW_PORT; }\" | sudo tee \$UPSTREAM_FILE > /dev/null

          echo '--- Validating Nginx config ---'
          sudo nginx -t

          echo '--- Reloading Nginx ---'
          sudo systemctl reload nginx

          echo '--- Post-switch validation ---'
          if ! curl -f http://localhost/health/ready; then
              echo 'Post-switch validation failed → rolling back'

              echo \"upstream backend { server 127.0.0.1:\$CURRENT_PORT; }\" | sudo tee \$UPSTREAM_FILE
              sudo systemctl reload nginx

              docker rm -f api-green
              exit 1
          fi

          echo '--- Cleaning up old container ---'
          docker rm -f api-blue 2>/dev/null || true

          echo '--- Promoting green → blue ---'
          docker rename api-green api-blue

          echo '--- Deployment successful ---'
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "main"