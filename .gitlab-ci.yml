# -------------------------
# Build
# -------------------------
build:
  extends: .go_default
  stage: build
  script:
    - mkdir -p build
    - GOOS=linux GOARCH=amd64 go build -o build/noheir-api.new ./cmd/main.go
  artifacts:
    paths:
      - build/noheir-api.new
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -------------------------
# Deploy (production)
# -------------------------
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan 103.90.226.110 >> ~/.ssh/known_hosts

  script:
    - scp build/noheir-api.new quang@103.90.226.110:/home/quang/
    - |
      ssh quang@103.90.226.110 "
        mv noheir-api noheir-api.bak || true &&
        mv noheir-api.new noheir-api &&
        systemctl restart noheir &&
        curl -f http://localhost:8080/health/live
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
