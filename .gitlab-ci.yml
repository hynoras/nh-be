stages:
  - lint
  - test
  - build
  - deploy

.go_default:
  image: golang:1.25-alpine
  interruptible: true
  cache:
    key: go-mod
    paths:
      - /go/pkg/mod
      - ~/.cache/go-build
  before_script:
    - go version

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# -------------------------
# Lint
# -------------------------
lint:
  extends: .go_default
  stage: lint
  script:
    - echo "Checking code..."
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    - golangci-lint run --timeout=5m
    - echo "No lint issues found."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# -------------------------
# Unit Tests
# -------------------------
unit_test:
  extends: .go_default
  stage: test
  script:
    - echo "Running experiment result..."
    - go test -v ./internal/features/...
    - echo "All test passed."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# -------------------------
# Build
# -------------------------
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind

  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker build --pull -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -------------------------
# Deploy (production)
# -------------------------
deploy_production:
  stage: deploy
  image: alpine:latest
  timeout: 5m
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan noheir-api.duckdns.org >> ~/.ssh/known_hosts

  script:
    - |
      ssh -o ConnectTimeout=10 quang@noheir-api.duckdns.org "
        set -ex

        cd /home/quang

        if [ -f current_version.txt ]; then
          cp current_version.txt previous_version.txt
        fi

        echo $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA > current_version.txt

        touch .env
        grep -v '^IMAGE_TAG=' .env > .env.tmp || true
        echo IMAGE_TAG=\$(cat current_version.txt) >> .env.tmp
        mv .env.tmp .env

        docker compose pull
        docker compose up -d --remove-orphans

        sleep 25

        STATUS=\$(docker inspect --format='{{.State.Health.Status}}' \$(docker compose ps -q api))

        if [ \"\$STATUS\" != \"healthy\" ]; then
          echo \"Deploy failed, rolling back\"

          if [ -f previous_version.txt ]; then
            IMAGE_TAG=\$(cat previous_version.txt) docker compose up -d
          else
            echo \"No previous version found, cannot rollback\"
            exit 1
          fi

          exit 1
        fi
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "main"