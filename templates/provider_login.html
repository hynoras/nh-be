<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Successful</title>
</head>
<body>
    <p>Authentication successful. You can close this window.</p>
    <script>
        const targetOrigin = "{{ .FrontendURL }}";
        if (window.opener) {
            window.opener.postMessage({ type: "LOGIN_SUCCESS" }, targetOrigin);
            window.close();
        } else {
            console.warn("No opener found");
        }
    </script>
</body>
</html>
