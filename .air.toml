# .air.toml

root = "."
tmp_dir = "tmp"

[build]
  # Command to build your app binary
  cmd = "go build -o tmp/noheir.exe ./cmd/main.go"

  # Binary output
  bin = "tmp/noheir.exe"
  
  # Watch directories for changes
  include_dir = ["cmd", "internal", "config", "router", "pkg", "mq", "router", "config", "template", "tests"]
  # Exclude directories/files that don't need watching
  exclude_dir = ["tmp", "vendor", ".git"]
  # File types to watch
  include_ext = ["go", "tpl", "tmpl", "html"]
  delay = 1500
  kill_signal = "SIGTERM"
  log = "build-errors.log"

[color]
  main = "yellow"
  watcher = "cyan"
  build = "green"
  runner = "magenta"
  app = "white"

[log]
  time = true


